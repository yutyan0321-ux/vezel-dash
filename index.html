<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.dash{padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px))}</style>
<title>ヴェゼル ダッシュ</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Noto+Sans+JP:wght@500;700&display=swap">
<style>
/* Layout: landscape cockpit — glassy instrument panel on the left (clock, arc speedometer), paged 3×2 app tiles on the right, destination dock below. Single deliberate night look for a car screen. */
:root {
  --bg: #070b14;
  --glass: rgba(24, 33, 52, .72);
  --glass-hi: rgba(36, 48, 74, .9);
  --sheet: #121a2b;
  --edge: rgba(140, 165, 210, .16);
  --fg: #f2f5fa;
  --muted: #8f9cb3;
  --amber: #ffb43c;
  --danger: #ff6b6b;
  --gap: 12px;
  --font-num: "Barlow", "Helvetica Neue", system-ui, sans-serif;
  --font-ui: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
body { height: 100%; }
body {
  background:
    radial-gradient(60% 50% at 62% -10%, rgba(255, 180, 60, .16), transparent 70%),
    radial-gradient(50% 60% at 100% 100%, rgba(61, 139, 255, .12), transparent 70%),
    var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
.dash {
  height: 100%;
  box-sizing: border-box;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  grid-template-columns: minmax(190px, 30%) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  gap: var(--gap);
}
.glass {
  background: rgba(10, 15, 26, .46);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid rgba(255, 255, 255, .10);
  border-radius: 24px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.25);
}
/* User background image + dimming layer */
.bg { position: fixed; inset: 0; z-index: -1; background: center / cover no-repeat; }
.bg::after { content: ""; position: absolute; inset: 0; background: rgba(4, 7, 14, var(--dim, .35)); }
.clock, .date, .t-name, .wx-temp { text-shadow: 0 1px 4px rgba(0,0,0,.55); }

/* Instrument panel */
.rail {
  grid-row: 1 / 3;
  padding: 14px 16px;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px;
  min-width: 0; min-height: 0;
}
.clock {
  font-family: var(--font-num); font-weight: 600;
  font-size: clamp(38px, 12vmin, 88px); line-height: .95;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.date { font-size: clamp(13px, 3.4vmin, 19px); font-weight: 500; margin-top: 2px; white-space: nowrap; }
.when { min-width: 0; }
.clock-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.sys { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding-top: 4px; flex: none; font: 600 12px var(--font-ui); color: var(--fg); opacity: .9; white-space: nowrap; }
.net { font-family: var(--font-num); font-size: 13px; font-weight: 700; letter-spacing: .02em; }
.net.off { color: var(--danger); }
.batt { display: inline-flex; align-items: center; gap: 5px; }
.batt b { font-family: var(--font-num); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.batt-body { position: relative; width: 22px; height: 11px; border: 1.5px solid currentColor; border-radius: 3px; box-sizing: border-box; padding: 1px; display: inline-block; }
.batt-body::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 3px; border-radius: 0 1px 1px 0; background: currentColor; }
.batt-fill { display: block; height: 100%; width: 50%; border-radius: 1px; background: currentColor; }
.batt.low { color: var(--danger); }
.batt.charging { color: #5fe08a; }
.sub-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; min-width: 0; flex-wrap: wrap; row-gap: 2px; }
.sub-row .date { margin-top: 0; }
.weather { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }
.wx-ico { width: clamp(18px, 5.4vmin, 26px); height: clamp(18px, 5.4vmin, 26px); flex: none; }
.wx-temp { font-family: var(--font-num); font-weight: 600; font-size: clamp(14px, 4.2vmin, 21px); line-height: 1; font-variant-numeric: tabular-nums; }
.wx-label { font-size: clamp(11px, 3vmin, 14px); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gauge { position: relative; min-height: 0; display: grid; place-items: center; container-type: size; }
@container (max-height: 120px) { .speed-note { display: none; } }
.gauge svg { width: 100%; height: 100%; max-height: 240px; display: block; }
.gauge .track { fill: none; stroke: rgba(140,165,210,.14); stroke-width: 9; stroke-linecap: round; }
.gauge .fill { fill: none; stroke: url(#amberGrad); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.gauge-read { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 4%; }
.speed-val {
  font-family: var(--font-num); font-weight: 700;
  font-size: clamp(28px, min(13vmin, 40cqh), 96px); line-height: .9;
  font-variant-numeric: tabular-nums;
}
.speed-unit { font-family: var(--font-num); font-size: clamp(13px, 3.6vmin, 22px); color: var(--muted); }
.speed-note { font-size: 11px; color: var(--muted); white-space: nowrap; }
.rail-actions { display: flex; gap: 8px; container-type: inline-size; }
@container (max-width: 250px) { .rail-actions .pill { padding: 0 6px; gap: 4px; font-size: 12px; } .rail-actions .pill svg { width: 16px; height: 16px; } }
.pill {
  flex: 1 1 0; min-width: 0; min-height: 42px; border-radius: 999px; border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.07); color: var(--fg); font: 700 13px var(--font-ui); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px;
  white-space: nowrap;
}
.pill svg { width: 18px; height: 18px; flex: none; }
.pill span { overflow: hidden; text-overflow: ellipsis; }
.pill[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }
.pill.chip { flex: 0 0 auto; min-height: 34px; padding: 0 14px; font-size: 12px; color: var(--muted); }
.pill.chip[aria-pressed="true"] { color: var(--amber); background: rgba(255,180,60,.12); }

/* App icons: paged, row-major 4×2 per page, no tile boxes */
.grid-wrap { position: relative; min-width: 0; min-height: 0; }
.grid {
  height: 100%;
  display: grid;
  grid-template-rows: repeat(2, minmax(0, 1fr));
  grid-auto-columns: calc((100% - 3 * var(--gap)) / 4);
  gap: var(--gap);
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}
.grid::-webkit-scrollbar { display: none; }
.tile {
  position: relative; display: block; container-type: size;
  color: var(--fg); text-decoration: none; min-width: 0; min-height: 0;
  border-radius: 18px; scroll-snap-align: start;
  transition: transform .12s ease;
}
.tile:active { transform: scale(.92); }
.tile-in {
  height: 100%; box-sizing: border-box; padding: 4px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
}
@container (max-height: 72px) {
  .tile-in { gap: 3px; padding: 2px; }
  .tile-in .t-name { font-size: 11px; }
}
.tile:focus-visible, .pill:focus-visible, .dest:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.app {
  position: relative; overflow: hidden; flex: none;
  height: clamp(32px, min(17vmin, 64cqh), 96px); aspect-ratio: 1; max-width: 86%;
  border-radius: 23%; display: grid; place-items: center;
  box-shadow:
    0 6px 18px rgba(0,0,0,.4),
    inset 0 1.5px 1px rgba(255,255,255,.55),
    inset 0 -3px 8px rgba(0,0,0,.14);
}
.app::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.32), rgba(255,255,255,0) 48%);
}
.app svg { position: relative; z-index: 1; width: 58%; height: 58%; filter: drop-shadow(0 1px 2px rgba(0,0,0,.18)); }
.app.custom { background: none !important; }
.app.custom::after { display: none; }
.app img { width: 100%; height: 100%; object-fit: cover; display: block; }
.t-name {
  flex: none; font-size: clamp(11px, 3.1vmin, 17px); font-weight: 600; line-height: 1.25; text-align: center; letter-spacing: .01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.pager {
  position: absolute; left: 0; right: 0; bottom: calc(-1 * var(--gap) + 3px);
  display: flex; justify-content: center; gap: 6px; pointer-events: none;
}
.pager i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.25); }
.pager i.on { background: var(--fg); }

/* Destination dock */
.dock { display: flex; gap: 8px; align-items: stretch; padding: 8px; min-width: 0; }
.dest {
  flex: 1 1 0; min-width: 0; min-height: 48px; border-radius: 999px;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08);
  color: var(--fg); text-decoration: none; cursor: pointer;
  display: flex; align-items: center; gap: 10px; padding: 0 14px 0 6px;
}
.dest:active { background: var(--glass-hi); }
.dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.dot svg { width: 20px; height: 20px; }
.dest .txt { min-width: 0; text-align: left; }
.dest b { display: block; font-size: 15px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dest small { display: block; font-size: 12px; line-height: 1.3; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dest.edit { flex: 0 0 auto; padding: 0 18px; gap: 8px; }
.dest.edit svg { width: 20px; height: 20px; }

/* Editor */
.sheet {
  position: fixed; inset: 0; background: rgba(3, 6, 12, .78);
  display: grid; place-items: center; z-index: 5;
  padding-block: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-card {
  background: var(--sheet); border: 1px solid var(--edge); border-radius: 22px;
  width: min(760px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box;
  display: flex; flex-direction: column;
}
.sheet-head { padding: 16px 18px 6px; display: flex; flex-direction: column; gap: 4px; }
.sheet-head h2 { margin: 0; font-size: 17px; }
.sheet-head p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
.tabs { display: flex; gap: 6px; padding: 8px 18px 0; }
.tab { flex: 0 0 auto; min-height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--edge); background: transparent; font-weight: 700; font-size: 13px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--sheet); border-color: var(--fg); }
.list { padding: 4px 18px 8px; display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: start; padding-block: 12px; border-bottom: 1px solid var(--edge); }
.item .app { height: 52px; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.item .dot { width: 44px; height: 44px; margin: 4px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; min-width: 0; }
.fields .full { grid-column: 1 / -1; }
.fields input, .fields select {
  min-width: 0; width: 100%; box-sizing: border-box; background: var(--bg); color: var(--fg); border: 1px solid var(--edge);
  border-radius: 12px; padding: 9px 10px; font: 500 14px var(--font-ui); user-select: text; -webkit-user-select: text;
}
.btns { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.sbtn {
  min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--edge);
  background: rgba(255,255,255,.04); font: 700 12px var(--font-ui); cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
}
.sbtn:disabled { opacity: .35; cursor: default; }
.sbtn.danger { color: var(--danger); }
.add { margin: 12px 18px 4px; min-height: 44px; border-radius: 14px; border: 1px dashed rgba(140,165,210,.4); background: transparent; font-weight: 700; font-size: 14px; cursor: pointer; }
.add:disabled { opacity: .35; }
.sheet-foot {
  position: sticky; bottom: 0; margin-top: auto;
  display: flex; gap: 8px; align-items: center; padding: 12px 18px;
  background: var(--sheet); border-top: 1px solid var(--edge);
}
.sheet-foot .status { flex: 1; min-width: 0; font-size: 12px; color: var(--amber); }
.sheet-foot .pill { flex: 0 0 auto; padding: 0 18px; }
.pill.primary { background: var(--amber); color: #1d1304; border-color: var(--amber); }
.bg-edit { padding: 12px 18px 8px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.bg-prev { aspect-ratio: 19.5 / 9; max-width: 100%; border-radius: 14px; border: 1px solid var(--edge); background: center / cover no-repeat, linear-gradient(135deg, #1a2440, #070b14); position: relative; overflow: hidden; }
.bg-prev::after { content: ""; position: absolute; inset: 0; background: rgba(4, 7, 14, var(--dim, .35)); }
.bg-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.bg-side label.range { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; }
.bg-side input[type=range] { width: 100%; accent-color: var(--amber); }
.bg-side .note { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; }
@media (max-width: 560px) { .bg-edit { grid-template-columns: minmax(0, 1fr); } }
.linkish { background: none; border: 0; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }

.portrait-hint { display: none; }

@media (max-height: 380px) {
  :root { --gap: 10px; }
  .dash { padding-block: 8px; }
  .rail { padding: 10px 14px; }
  .pill { min-height: 38px; }
  .dest { min-height: 44px; }
  .dot { width: 32px; height: 32px; }
  .dock { padding: 6px; }
}
@media (max-width: 640px) and (orientation: portrait) {
  body { overflow: auto; }
  .dash { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
  .rail { grid-row: auto; grid-template-rows: auto 200px auto; }
  .dest.edit { flex: 1 1 100%; justify-content: center; }
  .clock { font-size: 64px; }
  .speed-val { font-size: 72px; }
  .grid-wrap { height: 330px; }
  .dock { flex-wrap: wrap; }
  .dest { flex: 1 1 140px; }
  .portrait-hint { display: block; text-align: center; color: var(--muted); font-size: 12px; margin: 0; }
}
@media (max-width: 560px) { .fields { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .tile, .gauge .fill { transition: none; } }
</style>

</head>
<body>
<div class="bg" id="bg" aria-hidden="true" hidden></div>
<main class="dash">
  <section class="rail glass" aria-label="計器">
    <div class="when">
      <div class="clock-row">
        <div class="clock" id="clock">17:38</div>
        <div class="sys" id="sys" hidden>
          <span class="net" id="net">5G</span>
          <span class="batt" id="batt"><i class="batt-body"><i class="batt-fill" id="battFill"></i></i><b id="battPct">--%</b></span>
        </div>
      </div>
      <div class="sub-row">
        <span class="date" id="date">10月21日（水）</span>
        <span class="weather" id="weather" aria-label="天気" hidden>
          <svg class="wx-ico" id="wxIco" viewBox="0 0 24 24" aria-hidden="true"></svg>
          <b class="wx-temp" id="wxTemp">--°</b>
          <span class="wx-label" id="wxLabel"></span>
        </span>
      </div>
    </div>
    <div class="gauge">
      <svg viewBox="0 0 200 165" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <linearGradient id="amberGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#ffcf5a"/>
            <stop offset="1" stop-color="#e58a1a"/>
          </linearGradient>
        </defs>
        <path class="track" d="M 37 152 A 80 80 0 1 1 163 152"/>
        <path class="fill" id="arc" d="M 37 152 A 80 80 0 1 1 163 152"/>
      </svg>
      <div class="gauge-read">
        <div class="speed-val" id="speed">--</div>
        <div class="speed-unit">km/h</div>
        <div class="speed-note" id="speedNote">GPS 準備中</div>
      </div>
    </div>
    <div class="rail-actions">
      <button class="pill chip" id="wake" aria-pressed="false" title="画面を消さない">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="wakeLabel">画面ON</span>
      </button>
    </div>
  </section>

  <div class="grid-wrap">
    <nav class="grid" id="grid" aria-label="アプリ"></nav>
    <div class="pager" id="pager" aria-hidden="true"></div>
  </div>

  <div class="dock glass" id="dock" aria-label="よく行く場所"></div>
  <p class="portrait-hint">iPhoneを横向きにすると、ナビ画面いっぱいに表示されます</p>
</main>

<div class="sheet" id="sheet" hidden>
  <form class="sheet-card" id="editForm">
    <div class="sheet-head">
      <h2>ホーム画面を編集</h2>
      <p id="sheetHint"></p>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" id="tabApps" aria-selected="true">アプリ</button>
      <button type="button" class="tab" role="tab" id="tabDests" aria-selected="false">よく行く場所</button>
      <button type="button" class="tab" role="tab" id="tabBg" aria-selected="false">背景</button>
    </div>
    <div class="list" id="list"></div>
    <button type="button" class="add" id="addBtn">＋ 追加</button>
    <div class="sheet-foot">
      <div class="status" id="status"><button type="button" class="linkish" id="resetAll">最初の状態に戻す</button></div>
      <button type="button" class="pill" id="cancel">やめる</button>
      <button type="submit" class="pill primary">保存</button>
    </div>
  </form>
</div>

<script>
(function () {
  // ---------- Icon library (original glyphs) ----------
  const W = 'fill="rgba(255,255,255,.9)"';
  const ICONS = {
    maps:      { label: "ナビ矢印", tint: "42,170,120",  bg: "linear-gradient(180deg,#7be3a6,#2fb57c)", svg: '<path ' + W + ' d="M12 2.5 19 20l-7-3.2L5 20z"/>' },
    pin:       { label: "ピン",     tint: "70,110,220",  bg: "linear-gradient(180deg,#ffffff,#e9eef6)", svg: '<path fill="#2f6fe0" fill-rule="evenodd" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 4.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z"/>' },
    gs:        { label: "給油",     tint: "230,150,40",  bg: "linear-gradient(180deg,#ffc85a,#f2821f)", svg: '<path ' + W + ' d="M5 3h9a1 1 0 0 1 1 1v8h1.5a2 2 0 0 1 2 2v3a1 1 0 0 0 2 0V9l-2.3-2.3 1.4-1.4L22 8.6V17a3 3 0 0 1-6 0v-3h-1v7H4V4a1 1 0 0 1 1-1zm1 2v5h7V5H6z"/>' },
    store:     { label: "お店",     tint: "40,160,160",  bg: "linear-gradient(180deg,#6fd8cf,#1f9a9a)", svg: '<path ' + W + ' d="M4 8h16l-1.2 12H5.2zM8.5 8a3.5 3.5 0 0 1 7 0h-2a1.5 1.5 0 0 0-3 0z"/>' },

    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg><b>編集</b>';
    btn.addEventListener("click", function () { openSheet("apps"); });
    dock.appendChild(btn);
  }

  // ---------- Editor ----------
  const sheet = document.getElementById("sheet"), list = document.getElementById("list");
  const addBtn = document.getElementById("addBtn"), statusEl = document.getElementById("status"), hint = document.getElementById("sheetHint");
  const tabApps = document.getElementById("tabApps"), tabDests = document.getElementById("tabDests");
  const tabBg = document.getElementById("tabBg");
  let mode = "apps", dApps = [], dDests = [], dBg = { img: "", dim: .35 };

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function sbtn(text, fn, opts) {
    const b = el("button", "sbtn" + (opts && opts.danger ? " danger" : ""), text); b.type = "button";
    if (opts && opts.disabled) b.disabled = true;
    if (opts && opts.label) b.setAttribute("aria-label", opts.label);
    b.addEventListener("click", fn); return b;
  }
  function move(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; renderList(); }
  function toIcon(file, done) {
    const r = new FileReader();
    r.onload = function () {
      const img = new Image();
      img.onload = function () {
        const s = 192, c = document.createElement("canvas"); c.width = c.height = s;
        const m = Math.min(img.width, img.height);
        c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s);
        done(c.toDataURL("image/png"));
      };
      img.onerror = function () { done(null); };
      img.src = r.result;
    };
    r.onerror = function () { done(null); };
    r.readAsDataURL(file);
  }

  function renderList() {
    list.textContent = "";
    if (mode === "apps") {
      hint.textContent = "↑↓で並べ替え。8個ごとに次のページ（横スワイプ）になります。画像は正方形のものがきれいです。";
      dApps.forEach(function (a, i) {
        const item = el("div", "item");
        item.appendChild(appIcon(a));
        const f = el("div", "fields");
        const name = el("input"); name.id = "an" + i; name.value = a.name; name.placeholder = "名前"; name.setAttribute("aria-label", "名前");
        name.addEventListener("input", function () { a.name = name.value; });
        const sel = el("select"); sel.id = "ap" + i; sel.setAttribute("aria-label", "よく使うアプリから選ぶ");
        sel.appendChild(new Option("よく使うアプリから選ぶ", ""));
        PRESETS.forEach(function (p) { sel.appendChild(new Option(p.label, p.label)); });
        sel.addEventListener("change", function () {
          const p = preset(sel.value); if (!p) return;
          a.name = p.name; a.href = p.href; a.icon = p.icon; renderList();
        });
        const url = el("input", "full"); url.id = "au" + i; url.value = a.href; url.placeholder = "開くリンク（https://〜 や shortcuts:// など）"; url.setAttribute("aria-label", "開くリンク");
        url.addEventListener("input", function () { a.href = url.value.trim(); });
        const icSel = el("select"); icSel.id = "ai" + i; icSel.setAttribute("aria-label", "アイコンの絵柄");
        Object.keys(ICONS).forEach(function (k) { icSel.appendChild(new Option("絵柄：" + ICONS[k].label, k)); });
        icSel.value = ICONS[a.icon] ? a.icon : "web";
        icSel.disabled = !!a.img;
        icSel.addEventListener("change", function () { a.icon = icSel.value; renderList(); });
        const pick = el("label", "sbtn", "画像を選ぶ");
        const file = el("input"); file.type = "file"; file.accept = "image/*"; file.hidden = true; file.id = "af" + i;
        pick.appendChild(file);
        file.addEventListener("change", function () {
          if (!file.files || !file.files[0]) return;
          toIcon(file.files[0], function (data) {
            if (!data) { setStatus("この画像は読み込めませんでした。別の画像を選んでください。"); return; }
            a.img = data; renderList();
          });
        });
        const btns = el("div", "btns");
        btns.appendChild(sbtn("↑", function () { move(dApps, i, -1); }, { disabled: i === 0, label: "前へ移動" }));
        btns.appendChild(sbtn("↓", function () { move(dApps, i, 1); }, { disabled: i === dApps.length - 1, label: "後ろへ移動" }));
        btns.appendChild(pick);
        if (a.img) btns.appendChild(sbtn("画像を外す", function () { a.img = ""; renderList(); }));
        btns.appendChild(sbtn("削除", function () { dApps.splice(i, 1); renderList(); }, { danger: true }));
        f.appendChild(name); f.appendChild(sel); f.appendChild(url); f.appendChild(icSel);
        f.appendChild(btns);
        item.appendChild(f);
        list.appendChild(item);
      });
      addBtn.textContent = "＋ アプリを追加";
      addBtn.disabled = dApps.length >= MAX_APPS;
    } else if (mode === "bg") {
      hint.textContent = "好きな写真を背景にできます。文字が読みにくいときは「暗さ」を上げてください。";
      const wrap = el("div", "bg-edit");
      const prev = el("div", "bg-prev");
      const paint = function () {
        prev.style.backgroundImage = dBg.img ? 'url("' + dBg.img + '")' : "";
        prev.style.setProperty("--dim", String(dBg.dim));
      };
      const side = el("div", "bg-side");
      const btns = el("div", "btns");
      const pick = el("label", "sbtn", "写真を選ぶ");
      const file = el("input"); file.type = "file"; file.accept = "image/*"; file.hidden = true; file.id = "bgFile";
      pick.appendChild(file);
      file.addEventListener("change", function () {
        if (!file.files || !file.files[0]) return;
        setStatus("読み込み中…");
        toBg(file.files[0], function (data) {
          if (!data) { setStatus("この写真は読み込めませんでした。別の写真を選んでください。"); return; }
          dBg.img = data; resetStatus(); renderList();
        });
      });
      btns.appendChild(pick);
      if (dBg.img) btns.appendChild(sbtn("背景を外す", function () { dBg.img = ""; renderList(); }, { danger: true }));
      const rl = el("label", "range");
      const rt = el("span", null, "暗さ " + Math.round(dBg.dim * 100) + "%");
      const range = el("input"); range.type = "range"; range.id = "bgDim"; range.min = "0"; range.max = "75"; range.step = "5";
      range.value = String(Math.round(dBg.dim * 100));
      range.addEventListener("input", function () { dBg.dim = Number(range.value) / 100; rt.textContent = "暗さ " + range.value + "%"; paint(); });
      rl.appendChild(rt); rl.appendChild(range);
      side.appendChild(btns); side.appendChild(rl);
      side.appendChild(el("p", "note", "横長の写真がきれいに収まります。写真はこのiPhoneの中にだけ保存されます。"));
      wrap.appendChild(prev); wrap.appendChild(side);
      list.appendChild(wrap);
      paint();
    } else {
      hint.textContent = "住所か施設名を入れると、タップでGoogle マップのナビが始まります。最大" + MAX_DESTS + "か所まで。";
      dDests.forEach(function (d, i) {
        const item = el("div", "item");
        item.appendChild(destDot(d));
        const f = el("div", "fields");
        const name = el("input"); name.id = "dn" + i; name.value = d.name; name.placeholder = "名前（例：自宅）"; name.setAttribute("aria-label", "名前");
        name.addEventListener("input", function () { d.name = name.value; });
        const icSel = el("select"); icSel.id = "di" + i; icSel.setAttribute("aria-label", "アイコン");
        Object.keys(DEST_ICONS).forEach(function (k) { icSel.appendChild(new Option("アイコン：" + DEST_ICONS[k].label, k)); });
        icSel.value = DEST_ICONS[d.icon] ? d.icon : "pin";
        icSel.addEventListener("change", function () { d.icon = icSel.value; renderList(); });
        const addr = el("input", "full"); addr.id = "da" + i; addr.value = d.addr; addr.placeholder = "住所・施設名"; addr.setAttribute("aria-label", "住所・施設名");
        addr.addEventListener("input", function () { d.addr = addr.value.trim(); });
        const btns = el("div", "btns");
        btns.appendChild(sbtn("↑", function () { move(dDests, i, -1); }, { disabled: i === 0, label: "前へ移動" }));
        btns.appendChild(sbtn("↓", function () { move(dDests, i, 1); }, { disabled: i === dDests.length - 1, label: "後ろへ移動" }));
        btns.appendChild(sbtn("削除", function () { dDests.splice(i, 1); renderList(); }, { danger: true }));
        f.appendChild(name); f.appendChild(icSel); f.appendChild(addr); f.appendChild(btns);
        item.appendChild(f);
        list.appendChild(item);
      });
      addBtn.textContent = "＋ 場所を追加";
      addBtn.disabled = dDests.length >= MAX_DESTS;
    }
    addBtn.hidden = mode === "bg";
  }
  function setStatus(msg) {
    statusEl.textContent = msg;
  }
  function resetStatus() {
    statusEl.textContent = "";
    statusEl.appendChild(resetBtn);
  }
  const resetBtn = document.getElementById("resetAll");
  resetBtn.addEventListener("click", function () {
    if (mode === "apps") dApps = clone(DEFAULT_APPS);
    else if (mode === "bg") dBg = { img: "", dim: .35 };
    else dDests = clone(DEFAULT_DESTS);
    renderList();
  });
  function setMode(m) {
    mode = m;
    tabApps.setAttribute("aria-selected", String(m === "apps"));
    tabDests.setAttribute("aria-selected", String(m === "dests"));
    tabBg.setAttribute("aria-selected", String(m === "bg"));
    renderList();
  }
  tabApps.addEventListener("click", function () { setMode("apps"); });
  tabDests.addEventListener("click", function () { setMode("dests"); });
  tabBg.addEventListener("click", function () { setMode("bg"); });
  addBtn.addEventListener("click", function () {
    if (mode === "apps") dApps.push({ name: "", href: "", icon: "web", img: "" });
    else dDests.push({ name: "", addr: "", icon: "pin" });
    renderList();
    const last = list.lastElementChild; if (last) { last.scrollIntoView({ block: "nearest" }); const inp = last.querySelector("input"); if (inp) inp.focus(); }
  });
  function openSheet(m) {
    dApps = clone(apps); dDests = clone(dests); dBg = clone(bgSet);
    resetStatus();
    sheet.hidden = false;
    setMode(m || "apps");
  }
  document.getElementById("cancel").addEventListener("click", function () { sheet.hidden = true; });
  document.getElementById("editForm").addEventListener("submit", function (e) {
    e.preventDefault();
    apps = dApps.map(function (a) { return { name: (a.name || "").trim(), href: (a.href || "").trim(), icon: a.icon, img: a.img || "" }; });
    dests = dDests.map(function (d) { return { name: (d.name || "").trim(), addr: (d.addr || "").trim(), icon: d.icon }; });
    bgSet = { img: dBg.img || "", dim: dBg.dim };
    const ok = store(AKEY, apps) && store(DKEY, dests) && storeObj(BKEY, bgSet);
    renderApps(); renderDests(); applyBg();
    if (!ok) { setStatus("このブラウザでは保存できませんでした。画像を減らすか、保存を許可してください。"); return; }
    sheet.hidden = true;
  });

  renderApps(); renderDests(); applyBg();
})();
</script>
